services:
  evidence-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evidence-integrity-platform
    ports:
      - "8000:8000"
    volumes:
      - eip-storage:/app/backend/storage
    environment:
      - PYTHONUNBUFFERED=1
      - APP_STORAGE=/app/backend/storage
    restart: unless-stopped

volumes:
  eip-storage:
    driver: local
